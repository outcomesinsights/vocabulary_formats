# gator's standard for Python is "ruff defaults + I". The rule list is named here, not left to
# the default, so a ruff upgrade cannot change what "lint is green" means: ruff 0.16 enables
# about 788 rules by default, where 0.7 enabled E4, E7, E9 and F. This repo keeps no
# pyproject.toml on purpose (see CLAUDE.md), so the config lives in ruff.toml.
[lint]
select = ["E4", "E7", "E9", "F", "I"]
